name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless; cancelling it saves minutes
# on the free tier and avoids reading stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup reads the exact one from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store keyed on pnpm-lock.yaml, so installs download only what changed.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Service container: GitHub starts Postgres next to the job and waits for the health check
      # before the first step runs, so tests can connect like they do to docker compose locally.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arabic
          POSTGRES_PASSWORD: arabic
          POSTGRES_DB: arabic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arabic -d arabic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://arabic:arabic@localhost:5432/arabic_test
      DATABASE_URL_TEST: postgres://arabic:arabic@localhost:5432/arabic_test
      WEB_ORIGIN: http://localhost:5175
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The test harness migrates the database itself (src/test/global-setup.ts), so there is no
      # separate migrate step. One package at a time: they would otherwise share one test database.
      - run: pnpm -r --workspace-concurrency=1 test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan reads the whole history, not just the tip: a key committed and then deleted
          # is still a leaked key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The e2e and dependency-audit jobs arrive in phase 12.

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless; cancelling it saves minutes
# on the free tier and avoids reading stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup reads the exact one from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caches the pnpm store keyed on pnpm-lock.yaml, so installs download only what changed.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Service container: GitHub starts Postgres next to the job and waits for the health check
      # before the first step runs, so tests can connect like they do to docker compose locally.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arabic
          POSTGRES_PASSWORD: arabic
          POSTGRES_DB: arabic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arabic -d arabic_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://arabic:arabic@localhost:5432/arabic_test
      DATABASE_URL_TEST: postgres://arabic:arabic@localhost:5432/arabic_test
      WEB_ORIGIN: http://localhost:5175
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The test harness migrates the database itself (src/test/global-setup.ts), so there is no
      # separate migrate step. One package at a time: they would otherwise share one test database.
      - run: pnpm -r --workspace-concurrency=1 test

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    # Only after the cheap checks pass: a type error should not cost a browser install.
    needs: [check, test]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arabic
          POSTGRES_PASSWORD: arabic
          POSTGRES_DB: arabic_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arabic -d arabic_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # playwright.config.ts starts the API (NODE_ENV=test, fake AI provider: no Gemini key, no
      # network calls) and `vite preview` on ports of their own; e2e/global-setup.ts migrates and
      # seeds this database before the first spec.
      E2E_DATABASE_URL: postgres://arabic:arabic@localhost:5432/arabic_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The production bundle that `vite preview` serves.
      - run: pnpm --filter @arabic/web build
      # Chromium only: the project config has one browser, and this skips ~1 GB of Firefox/WebKit.
      - run: pnpm exec playwright install --with-deps chromium
      # `e2e:run` because the build step is above (`pnpm e2e` builds and runs, for laptops).
      - run: pnpm e2e:run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan reads the whole history, not just the tip: a key committed and then deleted
          # is still a leaked key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The dependency-audit job arrives in phase 12.

name: Uptime

# Every 30 minutes, ask the live app's health endpoint whether it and its database answer.
# On failure it opens a GitHub issue labelled `uptime` (or comments on the open one), and GitHub
# emails the repo owner. When the app answers again, it comments and closes the issue.
# GitHub may start scheduled runs late (minutes, sometimes more); that is fine for a free check.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://arabic-practice-phi.vercel.app/api/v1/health
    steps:
      # Neon's free compute sleeps after 5 idle minutes, and the health check gives the database
      # only a short time to answer, so the first probe after a quiet spell often says "db down".
      # Three tries 15 s apart give it time to wake; only three failures in a row count as down.
      - name: Probe
        id: probe
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "try $i: HTTP $code $(cat body.json 2>/dev/null)"
            if [ "$code" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 15
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "last=HTTP $code $(head -c 300 body.json 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Report
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.probe.outputs.ok }}
          LAST: ${{ steps.probe.outputs.last }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: 'uptime', state: 'open' });
            const issue = open.data[0];
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.OK === 'true') {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Back up (${run}).` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }
            const body = `The health check failed three times in a row.\n\nLast answer: \`${process.env.LAST}\`\n\nRun: ${run}`;
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'The live app is down', labels: ['uptime'], body });
            }
            core.setFailed('the live app is down');
